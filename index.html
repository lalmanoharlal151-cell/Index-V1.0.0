<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa A2A Dashboard</title>
</head>
<body>

    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <h1>Nexa A2A Dashboard</h1>
            <p class="subtitle">Agent-to-Agent Protocol & Reporting Panel</p>
        </header>

        <!-- Status Card -->
        <div class="status-card">
            <div class="status-item">
                <span>सिस्टम स्टेटस:</span>
                <span class="status-badge connected">ऑनलाइन</span>
            </div>
            <div class="status-item">
                <span>एजेंट ID:</span>
                <span>Nexa-Master-01</span>
            </div>
        </div>

        <!-- Action Control Area -->
        <div class="action-area">
            <input type="text" class="input-box" placeholder="मैसेज या कमांड दर्ज करें...">
            <button class="btn-primary">इवेंट भेजें (Send Log)</button>
        </div>

        <!-- Console / Log Output Card -->
        <div class="console-card">
            <p>[SYSTEM_START] Nexa A2A रिपोर्टिंग सिस्टम शुरू हो गया है!</p>
        </div>
    </div>

</body>
</html>
